#Configuracion MySql
#spring.datasource.url=jdbc:mysql://localhost:3306/martinabackend?serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credenciales de Aiven
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# OPEN API

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Usa una cadena larga y aleatoria para el secret
jwt.secret=estaEsUnaClaveSecretaMuyLargaParaElSistemaMartina2026QueCumpleConLosRequisitosDeSeguridadHS512
# Tiempo de expiración en segundos (ej. 3600 = 1 hora)
jwt.expiration=86400

